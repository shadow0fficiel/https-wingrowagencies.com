<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Wingrow Agencies | Retrait de fonds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Police -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS principal -->
    <link rel="stylesheet" href="css/index.css">

    <!-- CSS page -->
    <link rel="stylesheet" href="css/withdraw.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">W</div>
        <div class="logo-text">Wingrow Agencies</div>
    </div>
</header>

<main class="main-content">
    <div class="withdraw-card feature-card">

        <h2 class="withdraw-title">
            Retirer les fonds de votre portefeuille
        </h2>

        <p class="withdraw-desc">
        </p>

        <div class="alert-info">
            <strong>Information importante :</strong><br>
            Veuillez vérifier que le numéro <span class="highlight">22893955900</span>
            est bien le vôtre avant toute demande de retrait.
        </div>

        <div class="form-group">
            <label>Mode de paiement</label>
            <select>
                <option value="">Choisissez un mode de paiement</option>
                <option value="mobile">Mobile Money</option>
                <option value="bank">Virement bancaire</option>
            </select>
        </div>

        <div class="form-group">
            <label>Montant à retirer</label>
            <input type="number" placeholder="Entrez le montant">
        </div>

        <button class="btn btn-blue btn-large">
            Soumettre la demande
        </button>

    </div>
</main>

<footer class="footer">
    2026 © Wingrow by Psktech 
</footer>

<script src="js/withdraw.js"></script>
</body>
</html>
